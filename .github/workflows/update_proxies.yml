name: Update proxy URLs

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

# Do not let two repository-update workflows push to main at the same time.
concurrency:
  group: kafka-sub-updates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build proxy URL list
        run: |
          set -euo pipefail
          python proxy_parser.py

      - name: Commit proxy URLs
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proxies.txt

          if git diff --cached --quiet; then
            echo "[GIT] No changes to proxies.txt"
            exit 0
          fi

          git commit -m "Update proxy URLs"

          # The remote main branch may have changed since checkout.
          # Rebase our generated commit onto the current remote branch
          # before pushing, instead of failing with "fetch first".
          git pull --rebase origin main
          git push origin HEAD:main
