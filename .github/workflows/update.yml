name: Update subscription

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: kafka-sub-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Download Mihomo
        env:
          MIHOMO_VERSION: "1.19.30"
        run: |
          set -euo pipefail

          ARCHIVE="mihomo-linux-amd64-v1-v${MIHOMO_VERSION}.gz"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/${ARCHIVE}"

          wget -q --show-progress "$URL"
          gunzip -f "$ARCHIVE"

          mv "mihomo-linux-amd64-v1-v${MIHOMO_VERSION}" mihomo
          chmod +x mihomo

          ./mihomo -v

      - name: Build subscription and health-check nodes
        run: |
          set -euo pipefail
          python build.py

      - name: Validate generated Mihomo config
        run: |
          set -euo pipefail

          test -s config.yaml

          ./mihomo -t -f config.yaml

          echo "Generated config.yaml:"
          wc -l config.yaml
          du -h config.yaml

      - name: Commit config
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config.yaml

          if git diff --cached --quiet; then
            echo "No changes to config.yaml"
          else
            git commit -m "Update subscription"
            git push
          fi
